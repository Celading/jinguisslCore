[package]
  cjc-version = "1.0.0"
  version = "0.8.0"
  name = "jinguissl_core"
  output-type = "static"
  src-dir = "src"
  compile-option = "-Woff unused"
  license = "LGPL-3.0-only"
  description = "Cangjie cryptography core with X.509, TLS, and SSH protocol primitives"
  include = ["src", "docs", "LICENSE"]
  exclude = ["src/tests", "src/dtls_tests", "examples", "sample", "scripts", "testdata", ".github", "**/*_test.cj", "cangjie-repo.toml", ".env", ".env.*", "*.cjp"]
